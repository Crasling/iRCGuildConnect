name: Release AddOn

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for tags

      - name: Validate Version and Prepare Changelog
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          toc_file=$(find . -maxdepth 1 -name '*.toc' -print -quit)
          toc_version=$(awk -F': *' '/^## Version:/{print $2; exit}' "$toc_file")

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$release_version" != "$toc_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match TOC version $toc_version" >&2
            exit 1
          fi

          awk -v target="$release_version" '
            function flush_item() {
              if (item != "") {
                print item
                item = ""
              }
            }

            function header_version(    value) {
              if ($1 ~ /^v[0-9]/) {
                value = $1
                sub(/^v/, "", value)
              } else if ($1 == "Version") {
                value = $2
              } else if ($1 == "##" && $2 == "Version") {
                value = $3
              }
              if (value ~ /^[0-9]+\.[0-9]+\.[0-9]+$/) return value
              return ""
            }

            {
              version = header_version()
              if (version != "") {
                if (found) exit
                if (version == target) found = 1
                next
              }
            }

            found && $0 ~ /^[[:space:]]*\[[^]]+\][[:space:]]*/ {
              flush_item()
              line = $0
              sub(/^[[:space:]]*\[/, "", line)
              closing_bracket = index(line, "]")
              kind = substr(line, 1, closing_bracket - 1)
              line = substr(line, closing_bracket + 1)
              sub(/^[[:space:]]+/, "", line)
              item = "- **" kind ":** " line
              next
            }

            found && $0 ~ /^[[:space:]]*###[[:space:]]+/ {
              flush_item()
              line = $0
              sub(/^[[:space:]]+/, "", line)
              print line "\n"
              next
            }

            found && $0 ~ /^[[:space:]]*-[[:space:]]+/ {
              line = $0
              sub(/^[[:space:]]+/, "", line)
              if (item != "") {
                print item
                item = ""
                print "  " line
              } else {
                print line
              }
              next
            }

            found {
              line = $0
              sub(/^[[:space:]]+/, "", line)
              if (line == "") {
                flush_item()
                next
              }
              if (line ~ /^[-=─═]+$/) next
              if (item != "") item = item " " line
              else print line
            }

            END {
              flush_item()
              if (!found) exit 1
            }
          ' CHANGELOG.txt > .release-changelog.md

          if [[ ! -s .release-changelog.md ]]; then
            echo "No changelog section found for $GITHUB_REF_NAME" >&2
            exit 1
          fi

          printf '%s\n' \
            'manual-changelog: .release-changelog.md' \
            'ignore:' \
            '  - .release-changelog.md' \
            '  - .release.pkgmeta' \
            > .release.pkgmeta

      - name: Build and Publish Release
        uses: BigWigsMods/packager@v2
        with:
          args: -m .release.pkgmeta
